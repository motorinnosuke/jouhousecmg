<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG 4択ドリル — 情報セキュリティマネジメント試験対策</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg:#0a0e14;
    --panel:#10161f;
    --panel-2:#161e2a;
    --line:#1f2a3a;
    --txt:#dfe6f0;
    --muted:#76849a;
    --accent:#2ee6a6;
    --accent-dim:#1b8f6a;
    --warn:#ff5d6c;
    --gold:#f5b942;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(46,230,166,.07), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(245,185,66,.05), transparent 55%),
      var(--bg);
    color:var(--txt);
    font-family:'Zen Kaku Gothic New',sans-serif;
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 18px 80px;
  }
  .wrap{width:100%;max-width:760px}

  header{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;margin-bottom:8px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 14px var(--accent);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand h1{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;letter-spacing:.06em}
  .brand h1 span{color:var(--accent)}
  .sub{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.08em}

  .bar{
    display:flex;align-items:center;gap:14px;margin:22px 0 18px;
    font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted);flex-wrap:wrap;
  }
  .progress{flex:1;min-width:160px;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .progress i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));transition:width .4s ease}
  .stat b{color:var(--accent)}
  .stat.w b{color:var(--warn)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .filters button{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:7px 12px;
    border-radius:99px;cursor:pointer;transition:.18s;letter-spacing:.04em;
  }
  .filters button:hover{border-color:var(--accent-dim);color:var(--txt)}
  .filters button.on{background:rgba(46,230,166,.12);border-color:var(--accent);color:var(--accent)}

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:34px 30px;position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 40%,rgba(46,230,166,.04));pointer-events:none}
  .qhead{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
    font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);
  }
  .tag{background:var(--panel-2);border:1px solid var(--line);padding:5px 11px;
    border-radius:6px;color:var(--accent);letter-spacing:.05em}
  .qnum{letter-spacing:.1em}
  .q{font-size:1.16rem;line-height:1.7;font-weight:500;margin-bottom:24px;min-height:64px}

  .opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:1rem;font-weight:500;
    padding:15px 16px;border-radius:12px;cursor:pointer;transition:.15s;line-height:1.55;
  }
  .opt:hover:not(:disabled){border-color:var(--accent-dim);background:var(--panel-2)}
  .opt .key{
    font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;
    color:var(--muted);border:1px solid var(--line);border-radius:6px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--accent);background:rgba(46,230,166,.13)}
  .opt.correct .key{border-color:var(--accent);color:var(--accent)}
  .opt.wrong{border-color:var(--warn);background:rgba(255,93,108,.12)}
  .opt.wrong .key{border-color:var(--warn);color:var(--warn)}
  .opt.dim{opacity:.45}

  .feedback{
    border-radius:12px;padding:0 18px;max-height:0;opacity:0;overflow:hidden;
    transition:max-height .4s ease,opacity .3s ease,padding .4s ease,margin .4s ease;
    border:1px solid var(--line);
  }
  .feedback.show{max-height:360px;opacity:1;padding:16px 18px;margin-top:18px}
  .feedback.ok{border-color:var(--accent-dim);background:rgba(46,230,166,.07)}
  .feedback.no{border-color:var(--warn);background:rgba(255,93,108,.08)}
  .feedback .verdict{font-family:'JetBrains Mono',monospace;font-size:.72rem;
    letter-spacing:.12em;margin-bottom:8px}
  .feedback.ok .verdict{color:var(--accent)}
  .feedback.no .verdict{color:var(--warn)}
  .feedback .exp{font-size:.93rem;line-height:1.7;color:var(--muted)}
  .feedback .exp b{color:var(--txt)}

  .nextBtn{
    margin-top:18px;width:100%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#06120d;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;
    padding:15px;border-radius:12px;font-size:.95rem;transition:.16s;
  }
  .nextBtn:hover{filter:brightness(1.08)}
  .nextBtn:active{transform:translateY(1px)}
  .hidden{display:none!important}

  .done{text-align:center;padding:50px 20px}
  .done h2{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:1.4rem;margin-bottom:14px}
  .done .score{font-size:3rem;font-weight:900;margin:18px 0}
  .done .score small{font-size:1rem;color:var(--muted);font-weight:400}
  .done p{color:var(--muted);margin-bottom:26px}
  .done button{background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    color:#06120d;border:none;padding:14px 34px;border-radius:12px;font-weight:700;
    cursor:pointer;font-size:.95rem}

  footer{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:.66rem;
    color:var(--muted);text-align:center;letter-spacing:.06em;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <h1>SG<span>::</span>DRILL</h1>
    </div>
    <div class="sub">情報セキュリティマネジメント試験 / 4択・自動採点</div>
  </header>

  <div class="bar">
    <span class="qnum sub" id="counter">00 / 00</span>
    <div class="progress"><i id="pbar"></i></div>
    <span class="stat">正答 <b id="sCorrect">0</b></span>
    <span class="stat w">誤答 <b id="sWrong">0</b></span>
  </div>

  <div class="filters" id="filters"></div>

  <div id="quizArea">
    <div class="card" id="card">
      <div class="qhead">
        <span class="tag" id="cat">CATEGORY</span>
        <span class="qnum" id="qid">Q-000</span>
      </div>
      <div class="q" id="question">読み込み中…</div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <div class="exp" id="exp"></div>
      </div>
      <button class="nextBtn hidden" id="nextBtn">次の問題 →</button>
    </div>
  </div>

  <div class="card done hidden" id="doneCard">
    <h2>SESSION COMPLETE</h2>
    <div class="score" id="finalScore">0%<br><small>0 / 0 問正解</small></div>
    <p id="doneMsg"></p>
    <button id="restartBtn">もう一度挑戦する</button>
  </div>

  <footer>
    IPA 情報処理技術者試験 / レベル2 区分<br>
    出題範囲・要綱は改訂されることがあります。受験前に必ず IPA 公式の最新情報を確認してください。
  </footer>
</div>

<script>
// c = 正解の選択肢インデックス(0始まり)
const QUESTIONS=[
{cat:"情報セキュリティ",q:"情報セキュリティの3要素のうち、「認可された者だけが情報にアクセスできる」性質はどれか。",o:["完全性","可用性","機密性","真正性"],c:2,exp:"<b>機密性（Confidentiality）</b>。CIAのC。アクセス制御や暗号化で確保する。"},
{cat:"情報セキュリティ",q:"情報が改ざんされず、正確かつ完全である性質はどれか。",o:["可用性","完全性","責任追跡性","信頼性"],c:1,exp:"<b>完全性（Integrity）</b>。ハッシュ値やディジタル署名、アクセス制御で担保する。"},
{cat:"情報セキュリティ",q:"許可された利用者が必要なときに情報やシステムを使用できる性質はどれか。",o:["機密性","可用性","否認防止","真正性"],c:1,exp:"<b>可用性（Availability）</b>。冗長化、バックアップ、UPS、DoS対策などで確保する。"},
{cat:"情報セキュリティ",q:"利用者が行った操作を後から追跡・特定できる性質を何というか。",o:["責任追跡性","機密性","可用性","完全性"],c:0,exp:"<b>責任追跡性（Accountability）</b>。アクセスログの取得・保全で実現する。"},
{cat:"脅威・攻撃",q:"実在の組織になりすました偽メールで偽サイトへ誘導し情報を詐取する攻撃はどれか。",o:["DoS攻撃","フィッシング","ブルートフォース","ポートスキャン"],c:1,exp:"<b>フィッシング</b>。標的を絞る手口はスピアフィッシング、経営層狙いはホエーリング。"},
{cat:"脅威・攻撃",q:"特定組織を高度な手口で長期間執拗に狙い続ける標的型攻撃を指す略語はどれか。",o:["DDoS","APT","XSS","MITM"],c:1,exp:"<b>APT（Advanced Persistent Threat）</b>。潜伏と横展開を伴い検知が困難。"},
{cat:"脅威・攻撃",q:"ファイルを暗号化し復号と引き換えに金銭を要求するマルウェアはどれか。",o:["スパイウェア","ランサムウェア","アドウェア","ルートキット"],c:1,exp:"<b>ランサムウェア</b>。近年は窃取データの暴露を脅す二重恐喝が主流。"},
{cat:"脅威・攻撃",q:"標的がよく閲覧するWebサイトを改ざんし、訪問者を感染させる攻撃はどれか。",o:["水飲み場攻撃","SQLインジェクション","リプレイ攻撃","セッションハイジャック"],c:0,exp:"<b>水飲み場攻撃</b>。標的が自ら罠サイトに来るのを待つ受動的攻撃。"},
{cat:"脅威・攻撃",q:"人間の心理的な隙やミスにつけ込んで情報を盗む手法の総称はどれか。",o:["クロスサイトスクリプティング","ソーシャルエンジニアリング","バッファオーバフロー","DNSキャッシュポイズニング"],c:1,exp:"<b>ソーシャルエンジニアリング</b>。なりすまし電話、ショルダーハッキング、トラッシングなど。"},
{cat:"脅威・攻撃",q:"Webアプリの入力値に不正なSQL文を注入しDBを不正操作する攻撃はどれか。",o:["CSRF","SQLインジェクション","セッションフィクセーション","ディレクトリトラバーサル"],c:1,exp:"<b>SQLインジェクション</b>。対策はプレースホルダ（バインド機構）と入力値検証。"},
{cat:"脅威・攻撃",q:"利用者のブラウザに意図しないリクエストを送らせ、ログイン中のサイトで不正操作させる攻撃はどれか。",o:["XSS","CSRF","APT","DoS"],c:1,exp:"<b>CSRF</b>。対策はトークン埋め込み、Refererチェック、再認証など。"},
{cat:"脅威・攻撃",q:"複数の踏み台から大量リクエストを送りサービスを停止させる攻撃を指す略語はどれか。",o:["DDoS","BEC","MFA","PKI"],c:0,exp:"<b>DDoS（分散型サービス妨害）攻撃</b>。対策はCDN、WAF、レートリミット、上流遮断。"},
{cat:"脅威・攻撃",q:"取引先や経営者になりすました偽メールで送金等を促す詐欺を指す略語はどれか。",o:["BEC","EDR","SSO","IDS"],c:0,exp:"<b>BEC（ビジネスメール詐欺）</b>。多要素の確認プロセス導入が有効。"},
{cat:"暗号・認証",q:"暗号化と復号に同じ鍵を用いる暗号方式はどれか。",o:["公開鍵暗号方式","共通鍵暗号方式","ハイブリッド暗号","量子暗号"],c:1,exp:"<b>共通鍵暗号方式</b>。高速だが鍵配送問題がある。代表例はAES。"},
{cat:"暗号・認証",q:"暗号化と復号に異なる一対の鍵を用いる方式はどれか。",o:["共通鍵暗号方式","公開鍵暗号方式","ストリーム暗号","シーザー暗号"],c:1,exp:"<b>公開鍵暗号方式</b>。代表例はRSA、楕円曲線暗号。鍵配送問題を解決できる。"},
{cat:"暗号・認証",q:"送信者の秘密鍵でハッシュ値を暗号化し、なりすまし防止と改ざん検知を行う技術はどれか。",o:["共通鍵暗号","ディジタル署名","パスワードハッシュ","ワンタイムパスワード"],c:1,exp:"<b>ディジタル署名</b>。完全性・真正性・否認防止を実現。検証は送信者の公開鍵で行う。"},
{cat:"暗号・認証",q:"公開鍵が本人のものであることを第三者機関が証明する基盤を指す略語はどれか。",o:["PKI","SSL","VPN","DMZ"],c:0,exp:"<b>PKI（公開鍵基盤）</b>。認証局（CA）がディジタル証明書を発行・管理する。"},
{cat:"暗号・認証",q:"知識・所持・生体のうち2つ以上の異なる要素で本人確認を行う認証はどれか。",o:["シングルサインオン","多要素認証","リスクベース認証","パスワード認証"],c:1,exp:"<b>多要素認証（MFA）</b>。例：パスワード（知識）＋スマホのコード（所持）。"},
{cat:"暗号・認証",q:"一度の認証で複数サービスを利用できる仕組みはどれか。",o:["多要素認証","シングルサインオン","チャレンジレスポンス","生体認証"],c:1,exp:"<b>シングルサインオン（SSO）</b>。利便性が高い反面、認証情報漏えい時の影響範囲が大きい。"},
{cat:"暗号・認証",q:"任意長データから固定長の値を生成し、改ざん検知に使われる一方向の関数はどれか。",o:["共通鍵","ハッシュ関数","乱数生成器","公開鍵"],c:1,exp:"<b>ハッシュ関数</b>。一方向性と衝突困難性をもつ。SHA-256など。"},
{cat:"ISMS・管理",q:"組織の情報セキュリティを継続的に維持・改善する仕組みを指す略語はどれか。",o:["ITSM","ISMS","BCMS","QMS"],c:1,exp:"<b>ISMS</b>。国際規格はISO/IEC 27001、国内はJIS Q 27001。"},
{cat:"ISMS・管理",q:"ISMSが採用する、計画・実行・点検・処置を繰り返す継続的改善のサイクルはどれか。",o:["OODAループ","PDCAサイクル","ウォーターフォール","スパイラル"],c:1,exp:"<b>PDCAサイクル</b>。Plan-Do-Check-Act。マネジメントシステムの基本構造。"},
{cat:"ISMS・管理",q:"資産の脅威と脆弱性を洗い出し、影響度と発生可能性からリスクを評価する活動はどれか。",o:["リスクアセスメント","ペネトレーションテスト","ベンチマーク","インシデント対応"],c:0,exp:"<b>リスクアセスメント</b>。リスク特定→分析→評価の3段階。"},
{cat:"ISMS・管理",q:"保険加入や業務委託などで損失や責任を外部に移すリスク対応はどれか。",o:["リスク回避","リスク低減","リスク移転","リスク保有"],c:2,exp:"<b>リスク移転（共有）</b>。他にリスク低減、リスク回避、リスク保有がある。"},
{cat:"ISMS・管理",q:"許容範囲内と判断し、特段の対策をとらずに受け入れるリスク対応はどれか。",o:["リスク保有","リスク回避","リスク移転","リスク低減"],c:0,exp:"<b>リスク保有（受容）</b>。対策コストが損失見込みを上回る場合などに選択。"},
{cat:"ISMS・管理",q:"組織が情報セキュリティの基本方針・行動指針を明文化したものはどれか。",o:["BCP","情報セキュリティポリシー","SLA","プライバシーマーク"],c:1,exp:"<b>情報セキュリティポリシー</b>。基本方針・対策基準・実施手順の階層構造をとる。"},
{cat:"ISMS・管理",q:"事業中断時に重要業務を目標時間内に復旧させる計画を指す略語はどれか。",o:["BCP","SLA","RFP","KPI"],c:0,exp:"<b>BCP（事業継続計画）</b>。管理プロセス全体はBCM。RTO/RPOを定義する。"},
{cat:"ISMS・管理",q:"インシデント発生時に検知・分析・対応・再発防止を担う専門組織を指す略語はどれか。",o:["SOC","CSIRT","NOC","PMO"],c:1,exp:"<b>CSIRT（シーサート）</b>。Computer Security Incident Response Team。"},
{cat:"技術的対策",q:"ネットワーク境界で通信を制御し不正なアクセスを遮断する仕組みはどれか。",o:["ファイアウォール","ロードバランサ","プロキシキャッシュ","リバースプロキシ"],c:0,exp:"<b>ファイアウォール</b>。パケットフィルタリング型やアプリケーションゲートウェイ型がある。"},
{cat:"技術的対策",q:"Webアプリへの攻撃に特化して防御する仕組みを指す略語はどれか。",o:["WAF","VPN","DLP","DNS"],c:0,exp:"<b>WAF</b>。通信内容を解析し攻撃パターンに合致するリクエストを遮断する。"},
{cat:"技術的対策",q:"不正侵入を検知して管理者へ通知するシステムを指す略語はどれか。",o:["IDS","SSL","NAT","NTP"],c:0,exp:"<b>IDS（侵入検知システム）</b>。自動遮断まで行うのはIPS。"},
{cat:"技術的対策",q:"外部公開サーバを内部LANから隔離して設置する緩衝地帯のネットワーク領域はどれか。",o:["VLAN","DMZ","VPN","WAN"],c:1,exp:"<b>DMZ（非武装地帯）</b>。公開サーバ侵害時も内部LANへの被害を最小化する。"},
{cat:"技術的対策",q:"複数機器のログを集約・相関分析し脅威の予兆を検知する仕組みを指す略語はどれか。",o:["SIEM","SOAR","RPA","CDN"],c:0,exp:"<b>SIEM（シーム）</b>。横断的なログ分析で攻撃を早期検知する。"},
{cat:"技術的対策",q:"端末上の不審な挙動を検知・対応する仕組みを指す略語はどれか。",o:["EDR","MDM","DLP","IAM"],c:0,exp:"<b>EDR</b>。従来型アンチウイルスでは防げない攻撃の検知・封じ込めに有効。"},

let pool=[], idx=0, correct=0, wrong=0, activeCat="ALL", locked=false;
const el=id=>document.getElementById(id);
const KEYS=["A","B","C","D"];

function buildFilters(){
  const cats=["ALL",...new Set(QUESTIONS.map(q=>q.cat))];
  const box=el("filters");box.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.textContent=c==="ALL"?"すべて":c;
    b.className=c===activeCat?"on":"";
    b.onclick=()=>{activeCat=c;startSession();};
    box.appendChild(b);
  });
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function prepare(q){
  const opts=q.o.map((t,i)=>({t,correct:i===q.c}));
  const s=shuffle(opts);
  return {...q,sOpts:s,sCorrect:s.findIndex(x=>x.correct)};
}

function startSession(){
  const base=activeCat==="ALL"?QUESTIONS:QUESTIONS.filter(q=>q.cat===activeCat);
  pool=shuffle(base).map(prepare);
  idx=0;correct=0;wrong=0;
  el("doneCard").classList.add("hidden");
  el("quizArea").classList.remove("hidden");
  buildFilters();
  render();
}

function render(){
  if(idx>=pool.length){finish();return;}
  locked=false;
  const q=pool[idx];
  el("cat").textContent=q.cat;
  el("qid").textContent="Q-"+String(idx+1).padStart(3,"0");
  el("question").innerHTML=q.q;
  el("counter").textContent=String(idx+1).padStart(2,"0")+" / "+String(pool.length).padStart(2,"0");
  el("pbar").style.width=(idx/pool.length*100)+"%";
  el("sCorrect").textContent=correct;
  el("sWrong").textContent=wrong;

  const ob=el("opts");ob.innerHTML="";
  q.sOpts.forEach((op,i)=>{
    const btn=document.createElement("button");
    btn.className="opt";
    btn.innerHTML='<span class="key">'+KEYS[i]+'</span><span>'+op.t+'</span>';
    btn.onclick=()=>choose(i);
    ob.appendChild(btn);
  });

  el("feedback").className="feedback";
  el("nextBtn").classList.add("hidden");
}

function choose(i){
  if(locked)return;
  locked=true;
  const q=pool[idx];
  const correctIdx=q.sCorrect;
  const ok=i===correctIdx;
  if(ok)correct++;else wrong++;

  const btns=el("opts").querySelectorAll(".opt");
  btns.forEach((b,bi)=>{
    b.disabled=true;
    if(bi===correctIdx)b.classList.add("correct");
    else if(bi===i)b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb=el("feedback");
  fb.className="feedback show "+(ok?"ok":"no");
  el("verdict").textContent=ok?"▸ CORRECT — 正解":"▸ INCORRECT — 不正解";
  el("exp").innerHTML=q.exp;

  el("sCorrect").textContent=correct;
  el("sWrong").textContent=wrong;
  el("nextBtn").classList.remove("hidden");
  el("nextBtn").focus();
}

function next(){idx++;render();}

function finish(){
  el("quizArea").classList.add("hidden");
  el("doneCard").classList.remove("hidden");
  el("pbar").style.width="100%";
  const total=correct+wrong;
  const pct=total?Math.round(correct/total*100):0;
  el("finalScore").innerHTML=pct+"%<br><small>"+correct+" / "+total+" 問正解</small>";
  let msg;
  if(pct>=80)msg="合格圏内。この調子で全分野を反復しましょう。";
  else if(pct>=60)msg="あと一歩。誤答分野を重点的に復習しましょう。";
  else msg="基礎の定着が必要です。分野を絞って繰り返しましょう。";
  el("doneMsg").textContent=msg;
}

el("nextBtn").onclick=next;
el("restartBtn").onclick=startSession;

document.addEventListener("keydown",e=>{
  if(!el("doneCard").classList.contains("hidden"))return;
  const k=e.key.toUpperCase();
  if(!locked&&["A","B","C","D"].includes(k)){
    const btns=el("opts").querySelectorAll(".opt");
    const i=KEYS.indexOf(k);
    if(btns[i])choose(i);
  }else if(!locked&&["1","2","3","4"].includes(e.key)){
    choose(parseInt(e.key)-1);
  }else if(locked&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();next();
  }
});

buildFilters();
startSession();
</script>
